# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -march=native -pipe"
CFLAGS="${COMMON_FLAGS} -fno-lto -fno-use-linker-plugin -fno-fat-lto-objects"
CXXFLAGS="${COMMON_FLAGS} -fno-lto -fno-use-linker-plugin -fno-fat-lto-objects"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8
MAKEOPTS="-j10 -l10"
USE="-gvfs -lto wow64 -joystick -initramfs vulkan intel elogind -video_card_amdgpu -video_cards_nvidia -video_cards_ati -video_cards_nouveau -video_cards_vesa -video_cards_fbdev -telemetry -geolocation -tracker -crashreport -crash-reporter -geoloc -sentry -analytics -metrics X alsa pipewire pulseaudio sound-server udev dbus gtk openrc -kde -gnome -bluetooth -chromium -systemd"
ACCEPT_KEYWORDS="amd64"
ACCEPT_LICENSE="*"
GENTOO_MIRRORS="https://distfiles.gentoo.org"
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"
GRUB_PLATFORMS="efi-64"
FEATURES="parallel-fetch parallel-install preserve-libs fixlafiles unmerge-orphans compress-build-logs candy ccache"
VIDEO_CARDS="intel i915 iris"
LLVM_TARGETS="X86"
LDFLAGS="-Wl,-fuse-ld=mold -fno-lto -fno-use-linker-plugin -fno-fat-lto-objects"
EMERGE_DEFAULTS_OPTS="--binpkg-respect-use=y --binpkg-changed-deps=y --jobs=4 --load-average=10 --keep-going --complete-graph --with-bdeps=y"
CCACHE_DIR="/var/tmp/ccache"
CCACHE_SIZE="20G"
L10N="en en-US"
